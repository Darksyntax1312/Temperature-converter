<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="box-container">

            <div class="heading">Temperature converter</div>

            <div class="units-container">

                <div class="Degree-box">
                    <div>Degrees</div>
                    <div><input type="number" class="degree-input"></div>
                </div>

                <div class="Type-box">
                    <div>Type</div>
                    <select name="Temperature" id="A2324">
                        <option value="Celsius">Celsius</option>
                        <option value="Fahrenheit">Fahrenheit</option>
                    </select>
                </div>
            </div>

            <div class="result-Container">
                <div>Result</div>
                <div><input class="result-input" type="text"></div>
            </div>

            <div class="button-Container"><button class="btn-1">Convert</button></div>

        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
